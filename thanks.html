<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | Van-Phuc Bui</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06111e">
  <style>
    :root{--bg:#06111e;--panel:#0a1a2a;--line:rgba(143,181,221,.20);--line-strong:rgba(107,181,255,.34);--text:#f5f8fc;--muted:#a8b7c9;--blue:#3d8cff;--blue2:#68b6ff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 70% 0%,rgba(49,116,187,.17),transparent 34%),linear-gradient(180deg,#06111e,#07131f)}
    .card{width:min(680px,100%);padding:48px;border:1px solid var(--line);border-radius:16px;background:rgba(9,26,42,.82);box-shadow:0 28px 80px rgba(0,0,0,.28)}
    .icon{width:52px;height:52px;display:grid;place-items:center;margin-bottom:24px;border:1px solid var(--line-strong);border-radius:50%;background:rgba(61,140,255,.10);color:var(--blue2);font-size:25px}
    .eyebrow{margin-bottom:12px;color:#79b8ff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin-bottom:16px;font-size:clamp(34px,6vw,48px);line-height:1.05;letter-spacing:-.035em}
    p{max-width:560px;color:#bcc9d7;font-size:17px;line-height:1.7}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
    a{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:9px;color:#fff;text-decoration:none;font-size:15px;font-weight:700;transition:.2s}
    a:hover{transform:translateY(-2px);border-color:var(--blue2)}
    .primary{background:linear-gradient(135deg,#1979f4,#3794ff);border-color:transparent}
    .secondary{background:rgba(5,19,33,.70)}
    @media(max-width:560px){.card{padding:34px 26px}.actions a{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <div class="eyebrow">Message received</div>
    <h1>Thank you for reaching out.</h1>
    <p>Your message has been sent successfully. I will review it and get back to you as soon as I can.</p>
    <div class="actions">
      <a class="primary" href="https://vanphucbui.com/">Back to website →</a>
      <a class="secondary" href="mailto:bvphuc28@gmail.com">Email directly</a>
    </div>
  </main>
</body>
</html>
